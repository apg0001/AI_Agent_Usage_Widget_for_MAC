name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Match tag and package version
        run: node scripts/release-harness.js validate-tag
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  build:
    name: Package ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            os: windows-latest
            target: --win
          - platform: mac
            os: macos-latest
            target: --mac
          - platform: linux
            os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile application
        run: npm run compile
      - name: Package without publishing
        run: npx electron-builder ${{ matrix.target }} --publish never --config.directories.output=release/build-${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify and stage exact release assets
        run: node scripts/stage-release-assets.js ${{ matrix.platform }} release/build-${{ matrix.platform }} release/staged-${{ matrix.platform }}
      - name: Upload verified package set
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/staged-${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish verified draft
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download all verified platform assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release/assets
          merge-multiple: true
      - name: Upload draft, verify remote assets, and publish
        run: node scripts/publish-release.js release/assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
